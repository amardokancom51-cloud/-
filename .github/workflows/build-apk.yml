name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project

          echo "Project files:"
          find project -maxdepth 3 -type f | head -100

          # Remove invalid debugConfig signing
          if [ -f "project/app/build.gradle.kts" ]; then
            sed -i '/signingConfig = signingConfigs.getByName("debugConfig")/d' project/app/build.gradle.kts
          fi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager "platform-tools"

          COMPILE_SDK=$(grep -RhoE 'compileSdk(Version)?[[:space:]]*=?[[:space:]]*[0-9]+' project 2>/dev/null | grep -oE '[0-9]+' | head -n 1)

          if [ -z "$COMPILE_SDK" ]; then
            COMPILE_SDK=35
          fi

          echo "Using Android SDK: $COMPILE_SDK"

          sdkmanager "platforms;android-$COMPILE_SDK"

      - name: Find Gradle project
        shell: bash
        run: |
          echo "Searching for Gradle project..."

          GRADLE_FILE=$(find project -name "gradlew" -type f | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: gradlew not found"
            find project -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Found Gradle wrapper: $GRADLE_FILE"

          chmod +x "$GRADLE_FILE"

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "Searching for APK..."

          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: |
            project/**/build/outputs/apk/**/*.apk
            project/**/build/outputs/apk/*.apk
          if-no-files-found: error
